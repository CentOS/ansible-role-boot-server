---
- name: Install DHCP packages
  yum:
    name: "{{ dhcp_pkgs }}"
    state: installed
  tags:
    - pkgs

- name: Configure legacy dhcpd
  template:
    src: dhcpd.conf.j2
    dest: "{{ dhcp_config_path }}"
    mode: 0644
  notify: restart_dhcpd
  when: not use_kea | default(false)
  tags:
    - config

- name: Configure Kea DHCP
  template:
    src: kea-dhcp4.conf.j2
    dest: "{{ dhcp_config_path }}"
    mode: 0644
    owner: root
    group: root
  notify: restart_kea_dhcp4
  when: use_kea | default(false)
  tags:
    - config

- name: Validate Kea configuration
  command: kea-dhcp4 -t "{{ dhcp_config_path }}"
  changed_when: false
  when: use_kea | default(false)
  tags:
    - config

- name: Ensure DHCP service is started and enabled
  service:
    name: "{{ dhcp_service }}"
    state: started
    enabled: yes
